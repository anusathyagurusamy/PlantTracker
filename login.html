
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>PLANTEENA Login</title>

    <link rel="stylesheet" href="login.css">

    <!-- Font Awesome -->
    

</head>

<body>

<div class="overlay">

    <div class="login-card">

        <h1>🌿 PLANTEENA</h1>

        <p>Smart Plant Watering Tracker</p>

        <hr>

        <!-- Login Form -->
        <form onsubmit="login(); return false;">

            <!-- Username -->

            <div class="input-group">

                <label>Username</label>

                <div class="input-box">

                    <i class="fa-solid fa-user"></i>

                    <input
                    type="text"
                    id="username"
                    placeholder="Enter Username"
                    required>

                </div>

            </div>

            <!-- Password -->

            <div class="input-group">

                <label>Password</label>

                <div class="input-box">

                    <i class="fa-solid fa-lock"></i>

                    <input
                    type="password"
                    id="password"
                    placeholder="Enter Password"
                    required>

                    <i
                    class="fa-solid fa-eye"
                    onclick="showPassword()"></i>

                </div>

            </div>

            <!-- Remember Me -->

            <div class="options">

                <label>

                    <input type="checkbox">

                    Remember Me

                </label>

                <a href="#">Forgot Password?</a>

            </div>

            <!-- Login Button -->

            <button
            type="submit"
            class="login-btn">

                LOGIN

            </button>

        </form>

        <div class="register">

            New User?

            <a href="#">Register Here</a>

        </div>

    </div>

</div>

<script src="login.js"></script>

</body>

</html>
